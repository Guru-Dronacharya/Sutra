server {
    listen 3000;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $up http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
    }
    location /gateway/ {
        set $up http://gateway:8001;
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
    }
    location /audit/ {
        set $up http://audit:8002;
        rewrite ^/audit/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
    }
    location /rag/ {
        set $up http://rag:8003;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
    }
    location /ws/ {
        set $up http://api:8000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}